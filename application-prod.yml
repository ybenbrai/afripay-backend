spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:mainline.proxy.rlwy.net}:${DB_PORT:33030}/${DB_NAME:railway}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:2012}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
